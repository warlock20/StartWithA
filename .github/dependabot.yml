# Monthly PR bumping genai-prices, the source of AI check token prices
# (app/services/ai_check/pricing.py). Only this package: other dependencies are updated by hand.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "genai-prices"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
