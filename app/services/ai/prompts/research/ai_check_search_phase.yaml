# AI check — the two-step search used by adapters that run web search as its own request (Gemini).
# Not a prompt template: stage prompts stay in their own YAML; these two texts frame the split.
name: "ai_check_search_phase"
description: "Search-first then structured-answer instructions for split web-search calls"
version: "1.0"
category: "research"
last_modified: "2026-10-14"

# Appended to the stage's request in the search-only step.
search_instruction: >-
  First, search the web for what this task needs. Do not answer from memory. Write up what you
  found as plain text: every source with its exact URL as it appears in the search results, and
  every figure with the source it came from. The structured answer comes in the next step.

# The user turn that starts the structured step; {tool_names} is the tool(s) to call.
answer_instruction: >-
  Now call {tool_names} using only what your search above found. Copy URLs exactly as written
  there; do not add sources or figures the search did not show.
