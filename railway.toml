# Railway Build Configuration
# https://docs.railway.com/reference/config-as-code

# Using Dockerfile for build (no nixpacks config needed)
#
# This file configures the WEB service only. The Celery worker and Celery beat
# run the same image with a different command and can't share this config
# (neither serves HTTP, so healthcheckPath below would fail their deploys) — see
# railway.worker.toml and railway.beat.toml.
[build]
builder = "dockerfile"

[deploy]
# No startCommand - using Dockerfile CMD instead
# The Dockerfile uses: CMD gunicorn --bind 0.0.0.0:$PORT run:app

# Health check
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
