# Railway Build Configuration
# https://docs.railway.com/reference/config-as-code

# Using Dockerfile for build (no nixpacks config needed)
#
# This file configures the WEB service only. The Celery worker runs the same
# image with a different command and can't share this config (a worker serves
# no HTTP, so healthcheckPath below would fail its deploy) — see
# railway.worker.toml. The Procfile is not consulted at all under the
# dockerfile builder, so its `worker:` line configures nothing.
[build]
builder = "dockerfile"

[deploy]
# No startCommand - using Dockerfile CMD instead
# The Dockerfile uses: CMD gunicorn --bind 0.0.0.0:$PORT run:app

# Health check
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
